<!DOCTYPE html>
<html>

<head>

    <title>User Behavior Analytics</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui-refresh.css') }}">
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">
        🧠 User Behavior Analytics
    </h1>

    <table class="table table-bordered table-striped">

        <thead>

            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Activity</th>
                <th>Count</th>
                <th>Risk Level</th>
                <th>Time</th>
            </tr>

        </thead>

        <tbody>

        {% for log in behavior_logs %}

            <tr>

                <td>{{ log.id }}</td>
                <td>{{ log.username }}</td>
                <td>{{ log.email }}</td>
                <td>{{ log.activity_type }}</td>
                <td>{{ log.activity_count }}</td>
                <td>{{ log.risk_level }}</td>
                <td>{{ log.created_at }}</td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

    <a href="/security-dashboard"
       class="btn btn-primary">

        Back to Security Dashboard

    </a>

</div>

</body>

</html>
