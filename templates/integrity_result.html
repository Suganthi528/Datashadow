<!DOCTYPE html>
<html>
<head>
    <title>File Integrity</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui-refresh.css') }}">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">File Integrity Check</h2>

        <p>
            <strong>File:</strong>
            {{ filename }}
        </p>

        {% if integrity_ok %}

            <div class="alert alert-success">
                <h4>✓ INTEGRITY OK</h4>
                <p>The file has not been modified.</p>
            </div>

        {% else %}

            <div class="alert alert-danger">
                <h4>⚠ FILE MODIFIED</h4>
                <p>The file hash does not match the stored hash.</p>
            </div>

        {% endif %}

        <a href="{{ url_for('dashboard') }}"
           class="btn btn-primary">
            Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
