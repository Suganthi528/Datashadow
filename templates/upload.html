<!DOCTYPE html>
<html>
<head>
    <title>Upload File - DataShadow</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui-refresh.css') }}">
</head>

<body>

    <h1>📤 Upload File</h1>

    <form action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data">

        <label>Select File:</label>

        <input type="file" name="file" required>

        <br><br>

        <button type="submit">
            Upload and Scan
        </button>

    </form>

    <br>

    <a href="{{ url_for('dashboard') }}">
        ← Back to Dashboard
    </a>

</body>
</html>
